<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>✨ Sprite Adventures ✨</title>
  <meta
    name="description"
    content="Sprite Adventures — A growing community built on trust and nonstop fun."
  >

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #06110b;
      --bg-light: #0a1b10;
      --card: rgba(13, 36, 21, 0.72);
      --green: #39ff88;
      --green-dark: #16a957;
      --green-glow: rgba(57, 255, 136, 0.25);
      --text: #f1fff5;
      --muted: #a5b9ab;
      --border: rgba(57, 255, 136, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(57, 255, 136, 0.10), transparent 30%),
        radial-gradient(circle at 80% 50%, rgba(22, 169, 87, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Animated background particles */
    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: float 10s ease-in-out infinite;
    }

    .orb.one {
      width: 300px;
      height: 300px;
      background: var(--green);
      top: 10%;
      left: -100px;
    }

    .orb.two {
      width: 250px;
      height: 250px;
      background: #00ff66;
      right: -80px;
      top: 45%;
      animation-delay: -4s;
    }

    .orb.three {
      width: 200px;
      height: 200px;
      background: #21c866;
      bottom: 0;
      left: 45%;
      animation-delay: -7s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
      }

      50% {
        transform: translateY(-35px) translateX(20px);
      }
    }

    /* Navbar */
    nav {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(6, 17, 11, 0.75);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(57, 255, 136, 0.08);
    }

    .logo {
      color: var(--text);
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .logo span {
      color: var(--green);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: 0.25s;
    }

    .nav-links a:hover {
      color: var(--green);
    }

    .nav-discord {
      padding: 10px 17px;
      border-radius: 10px;
      background: var(--green);
      color: #041008 !important;
      box-shadow: 0 0 20px var(--green-glow);
    }

    .nav-discord:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(57, 255, 136, 0.4);
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 130px 20px 80px;
    }

    .hero-content {
      max-width: 850px;
    }

    .badge {
      display: inline-block;
      padding: 8px 15px;
      border: 1px solid var(--border);
      background: rgba(57, 255, 136, 0.07);
      border-radius: 50px;
      color: var(--green);
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(3rem, 8vw, 6.5rem);
      line-height: 0.98;
      font-weight: 800;
      letter-spacing: -4px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: var(--green);
      text-shadow: 0 0 35px rgba(57, 255, 136, 0.3);
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.8;
    }

    .hero-buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 23px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.25s ease;
    }

    .button-primary {
      background: var(--green);
      color: #041008;
      box-shadow: 0 0 25px var(--green-glow);
    }

    .button-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 40px rgba(57, 255, 136, 0.4);
    }

    .button-secondary {
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.025);
    }

    .button-secondary:hover {
      border-color: var(--green);
      color: var(--green);
      transform: translateY(-3px);
    }

    /* Sections */
    section {
      padding: 100px 6%;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-heading .small-title {
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-heading h2 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      margin-bottom: 14px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 600px;
      margin: auto;
      line-height: 1.7;
    }

    /* Features */
    .features {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .feature-card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(15px);
      transition: 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .feature-card::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      background: var(--green);
      opacity: 0.04;
      border-radius: 50%;
      right: -40px;
      top: -40px;
    }

    .feature-card:hover {
      transform: translateY(-6px);
      border-color: rgba(57, 255, 136, 0.45);
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .feature-icon {
      font-size: 2rem;
      margin-bottom: 18px;
    }

    .feature-card h3 {
      margin-bottom: 9px;
      font-size: 1.15rem;
    }

    .feature-card p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.92rem;
    }

    /* About */
    .about-container {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 30px;
      align-items: stretch;
    }

    .profile-card,
    .about-card {
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(15px);
      border-radius: 22px;
      padding: 35px;
