<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprite Adventures</title>
  <style>
    :root {
      --bg: #030806;
      --panel: #0d1c13;
      --green: #39ff88;
      --green-soft: rgba(57, 255, 136, 0.12);
      --text: #ecfff3;
      --muted: #a7c2b0;
      --border: rgba(57, 255, 136, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(57, 255, 136, 0.12), transparent 35%),
        linear-gradient(180deg, var(--bg), #07140d, var(--bg));
      color: var(--text);
    }

    .profile-card {
      width: min(90vw, 440px);
      background: rgba(13, 28, 19, 0.9);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 0 30px rgba(57, 255, 136, 0.08);
      text-align: center;
    }

    .avatar-wrap {
      width: 140px;
      height: 140px;
      margin: 0 auto 18px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--green);
      background: rgba(57, 255, 136, 0.08);
      box-shadow: 0 0 25px rgba(57, 255, 136, 0.18);
    }

    .avatar-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -0.05em;
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--green-soft);
      border: 1px solid var(--border);
      color: var(--green);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    p {
      margin: 18px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar-wrap">
      <img src="https://avatars.githubusercontent.com/u/325791380?v=4" alt="XPLUZOYT profile picture" />
    </div>

    <h1>XPLUZOYT</h1>
    <div class="tag">Lead Admin</div>
    <p>Sprite Adventures website creator and community admin.</p>
  </div>
</body>
</html>
